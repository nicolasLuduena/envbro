[package]
name = "envbro"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas Luduena"]
description = "Drugs for your env files insecurities"
readme = "README.md"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
dialoguer = "0.11"
similar = { version = "2.4", features = ["inline"] }
walkdir = "2.4"
anyhow = "1.0"
console = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"
tempfile = "3.24.0"
